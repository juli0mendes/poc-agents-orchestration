name: CI

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install build and package
        run: |
          python -m pip install --upgrade pip
          pip install build
          pip install -e . || true

      - name: Install test and coverage tools
        run: |
          pip install coverage coverage-badge pytest || true

      - name: Run tests with coverage (if any)
        run: |
          set -e
          # detect tests
          if pytest --collect-only -q >/dev/null 2>&1; then
            echo "Tests detected — running pytest with coverage"
            coverage run -m pytest
          else
            echo "No tests collected — skipping pytest"
          fi

      - name: Generate coverage reports
        run: |
          # generate xml and svg badge when possible; ignore failures so CI doesn't break when no tests
          coverage xml || true
          if command -v coverage-badge >/dev/null 2>&1; then
            coverage-badge -o coverage.svg || true
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage.svg

      - id: add_or_update_readme
        name: Add or update README badge
        if: startsWith(github.ref, 'refs/heads/feature/') && success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only add badge if coverage.svg exists
          UPDATED=false
          if [ -f coverage.svg ]; then
            test -f README.md || echo "# $(basename $(pwd))" > README.md
            if ! grep -q "coverage.svg" README.md; then
              sed -i "1i![coverage](coverage.svg)" README.md || true
              UPDATED=true
            else
              echo "README already contains coverage badge"
            fi
          else
            echo "coverage.svg not found; skipping README update"
          fi

          # Check git for changes to README.md
          if [ "$UPDATED" = "true" ]; then
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

      - id: check_pr
        name: Check for existing PR from this branch
        if: startsWith(github.ref, 'refs/heads/feature/') && success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.ref_name }}"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          echo "Checking for open PRs from $OWNER:$BRANCH to main"
          RESPONSE=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls?head=$OWNER:$BRANCH&base=main&state=open")
          if [ -n "$RESPONSE" ] && [ "$RESPONSE" != "[]" ]; then
            echo "pr_exists=true" >> "$GITHUB_OUTPUT"
            echo "Found existing PR for $BRANCH"
          else
            echo "pr_exists=false" >> "$GITHUB_OUTPUT"
            echo "No existing PR found for $BRANCH"
          fi

      - name: Create Pull Request from feature branch to main
        if: startsWith(github.ref, 'refs/heads/feature/') && success() && steps.check_pr.outputs.pr_exists == 'false'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(ci): automated PR from feature branch to main\n\nCo-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          branch: ${{ github.ref_name }}
          title: "chore: automated PR from ${{ github.ref_name }} to main"
          body: "Automated PR created by CI run ${{ github.run_id }}"
          labels: automated
          base: main
